<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commander</title>
  <link rel="stylesheet" href="terminal.css">
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <header class="topbar">
    <span class="topbar-brand"><strong>commander</strong> / android agent</span>
    <div class="topbar-indicators">
      <div class="indicator">
        <div class="led on" id="ledServer"></div>
        <span>servidor</span>
      </div>
      <div class="indicator">
        <div class="led" id="ledAgent"></div>
        <span id="agentLabel">sin agente</span>
      </div>
      <button class="btn-clr" id="btnClear">limpiar</button>
    </div>
  </header>

  <!-- AGENTES SIDEBAR -->
  <aside class="agents-panel">
    <div class="panel-title">agentes</div>
    <div class="agents-list" id="agentsList">
      <div class="agents-empty">Sin agentes<br>conectados</div>
    </div>
  </aside>

  <!-- HISTORIAL -->
  <aside class="history-panel">
    <div class="panel-title">historial</div>
    <div class="history-list" id="historyList"></div>
  </aside>

  <!-- OUTPUT -->
  <main class="output-panel">
    <div class="output-scroll" id="output">
      <div class="boot" id="bootMsg">
        commander v3.0 — multi-agente Android<br>
        selecciona un agente en la barra lateral e introduce un comando
      </div>
    </div>
  </main>

  <!-- RESULTADO DETALLADO -->
  <aside class="result-panel">
    <div class="result-header">
      <span class="result-title">resultado</span>
      <span class="result-cmd-label" id="resultLabel">—</span>
    </div>
    <div class="result-body wait" id="resultBody">Sin resultado aún.</div>
  </aside>

  <!-- INPUT -->
  <footer class="input-bar">
    <div class="prompt-str">
      <span class="ph">›</span>
      <span class="active-agent-tag" id="activeAgentTag">—</span>
    </div>
    <input
      class="cmd-input"
      id="cmdInput"
      type="text"
      autocomplete="off"
      spellcheck="false"
      placeholder="selecciona un agente primero…"
      disabled
    >
    <button class="btn-exec" id="btnExec" disabled>run</button>
  </footer>

</div>
<script src="/socket.io/socket.io.js"></script>
<script src="terminal.js"></script>
</body>
</html>
